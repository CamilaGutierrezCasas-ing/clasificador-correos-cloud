# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - api-clasificador-correos

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: azure-webapp-api-clasificador-correos
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: correo-frontend
        run: |
          npm install
          npm run build

      - name: Copy frontend build into backend
        run: |
          rm -rf backend_base/app/static
          mkdir -p backend_base/app/static
          cp -r correo-frontend/dist/* backend_base/app/static/

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend_base
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend_base

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_37BD630A8E70444D8599EA7E1BC5F225 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E02351CC79C34297BD65AD787014A6EB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_18D5B5FCF0134A2683ED9C790F5F1CDE }}

      - name: Stop Azure Web App before deploy
        run: |
          az webapp stop --resource-group rg-clasificador-correos --name api-clasificador-correos
          sleep 20

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'api-clasificador-correos'
          slot-name: 'Production'
          package: .

      - name: Start Azure Web App after deploy
        if: always()
        run: |
          az webapp start --resource-group rg-clasificador-correos --name api-clasificador-correos